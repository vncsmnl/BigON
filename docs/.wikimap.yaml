home: docs
engine: none
pages:
  - path: README.md
    mode: none
    documents: [package.json, src/**]
  - path: getting-started.md
    mode: tutorial
    documents: [package.json, src/extension.ts]
  - path: how-to/use-the-extension.md
    mode: how-to
    documents: [src/ui/**, src/extension.ts, package.json]
  - path: how-to/add-language-support.md
    mode: how-to
    documents: [src/analyzer/universal/**, src/i18n/**, src/extension.ts, package.json]
  - path: reference.md
    mode: reference
    documents: [package.json]
  - path: ARCHITECTURE.md
    mode: explanation
    documents: [src/**]
  - path: CONTRIBUTING.md
    mode: how-to
    documents: [package.json, tsconfig.json, jest.config.js, test/**]
